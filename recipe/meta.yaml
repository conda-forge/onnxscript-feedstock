{% set version = "0.7.2" %}

package:
  name: onnxscript
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/o/onnxscript/onnxscript-{{ version }}.tar.gz
  sha256: 2c664f6383d10f332a4d47b2876dcab16dba84909fe703656b19abc281fda165

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=70.0.0
    - pip
  run:
    - python >={{ python_min }}
    - ml_dtypes
    - numpy
    - onnx-ir >=0.1.16,<2
    - onnx >=1.17
    - packaging
    - typing_extensions >=4.10

test:
  imports:
    - onnxscript
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/microsoft/onnxscript
  summary: Naturally author ONNX functions and models using a subset of Python
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - hmaarrfk
    - apmorton
